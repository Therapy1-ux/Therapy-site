name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/uploads
          for d in */; do
            if [ -d "${d}uploads" ]; then cp -rn "${d}uploads/." _site/uploads/; fi
          done
          cp -n *.mp4 _site/uploads/ 2>/dev/null || true
          cp -rf "seo-audit-pack 3/"* _site/ 2>/dev/null || true
          for d in about all-access cafe contact dining events frequently-asked-questions memberships packages privacy-policy referral-form services terms-conditions; do
            if [ -d "$d" ]; then cp -rf "$d" _site/; fi
          done
          cp -f *.html _site/ 2>/dev/null || true
          cp -f *.js *.txt *.xml _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
