<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expertise Card</title>
<meta name="description" content="Explore THERAPY™ services in Eltham — infrared sauna, hydrogen nanobubble ice bath, cryotherapy, NeuroSuite, diagnostics, psychology and functional medicine.">
<link rel="canonical" href="https://yourtherapy.au/all-services-landing-page/">
<meta property="og:type" content="website">
<meta property="og:title" content="Wellness Services Eltham | Infrared Sauna, Ice Bath, Cryotherapy &amp; NeuroSuite — THERAPY™">
<meta property="og:description" content="Explore THERAPY™ services in Eltham — infrared sauna, hydrogen nanobubble ice bath, cryotherapy, NeuroSuite, diagnostics, psychology and functional medicine.">
<meta property="og:url" content="https://yourtherapy.au/all-services-landing-page/">
<meta property="og:locale" content="en_AU">
<meta property="og:site_name" content="THERAPY">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="index, follow">
<meta name="geo.region" content="AU-VIC">
<meta name="geo.placename" content="Eltham, Victoria">
<script src="./support.js"></script>
</head>
<body>
<x-dc><a href="{{ href }}" style="position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;min-height:clamp(380px,34vw,480px);border-radius:14px;overflow:hidden;color:#F7F0E4;font-family:'Open Sans',sans-serif;text-decoration:none;background:{{ color }};isolation:isolate" style-hover="box-shadow:0 26px 50px -26px rgba(30,18,8,0.75)">
  <img src="{{ img }}" alt="{{ alt }}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:-2">
  <span style="position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,12,6,0.35) 0%,rgba(18,12,6,0.05) 28%,rgba(18,12,6,0.55) 58%,rgba(18,12,6,0.92) 100%)"></span>
  <span style="position:absolute;left:22px;top:16px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:#F2DDBF">{{ num }}</span>
  <div style="padding:24px 24px 26px;display:flex;flex-direction:column;gap:8px">
    <h3 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(24px,2vw,30px);line-height:1.08;margin:0;color:#F7F0E4;text-wrap:balance">{{ title }}</h3>
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.3;color:#E8C9A6">{{ tagline }}</div>
    <p style="font-size:14px;line-height:1.6;color:#E6DCCD;margin:4px 0 0;text-wrap:pretty">{{ body }}</p>
    <span style="padding-top:12px;font-size:11.5px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#E3B98C">Explore →</span>
  </div>
</a></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:460},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Brain, Mind & Nervous System&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Regulate. Reconnect. Reset.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Psychology, nervous system regulation and neurotechnology.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4E361F&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/THERAPY_TechnoGym.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Photography slot&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
